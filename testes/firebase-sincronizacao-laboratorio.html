<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Romaneio 2.0 — Sincronização</title><style>body{font:16px system-ui;background:#f3f9fb;color:#254D69;padding:20px}main{max-width:680px;margin:auto}section{background:#fff;border:1px solid #c5dce7;border-radius:14px;padding:18px;margin:14px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;margin:6px 0}input{border:1px solid #a4bdcb}button{background:#254D69;color:#fff;border:0}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5f8;padding:12px}label{font-weight:600;display:block;margin-top:10px}</style></head><body><main><h2>Romaneio 2.0 — Sincronização entre dispositivos</h2><p>Laboratório isolado: documento fictício, sem estoque real. Use o mesmo usuário nos dois dispositivos.</p><section><label>E-mail Firebase</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"><button id="login">1. Entrar</button><button id="logout" disabled>Encerrar sessão</button></section><section><h3>Palete fictício TESTE-SYNC-001</h3><label>Observação de teste (máx. 100 caracteres)</label><input id="note" maxlength="100" placeholder="Ex.: atualização pelo computador"><button id="save" disabled>2. Salvar observação fictícia</button><pre id="status">Aguardando login.</pre><pre id="live">Aguardando atualização.</pre><small>Sem baixas de caixas; nenhum dado operacional é acessado.</small></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,setPersistence,inMemoryPersistence,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAtlG-oys01gqgCdiANbzuzx9Mh9SiMRQo",authDomain:"romaneio-2-0-laboratorio.firebaseapp.com",projectId:"romaneio-2-0-laboratorio",appId:"1:343680211941:web:8ad689db2c09447c2ded0c"};
const $=id=>document.getElementById(id),app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let stop=null;const status=s=>$("status").textContent=s;
await setPersistence(auth,inMemoryPersistence);
const ref=()=>doc(db,"rom_lab_sync",auth.currentUser.uid);
$("login").onclick=async()=>{status("Autenticando...");$("login").disabled=true;try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value);$("save").disabled=false;$("logout").disabled=false;status("Autenticado. Aguardando sincronização...");stop=onSnapshot(ref(),{includeMetadataChanges:true},snap=>{if(!snap.exists()){$("live").textContent="Nenhuma observação salva ainda.";return;}const d=snap.data();$("live").textContent="Observação: "+d.observacao+"\nOrigem: "+d.origem+"\nServidor: "+(snap.metadata.fromCache?"cache local":"confirmado")+(snap.metadata.hasPendingWrites?" (envio pendente)":"");},e=>status("Falha ao escutar: "+e.code));}catch(e){status("Erro de login: "+e.code)}finally{$("pass").value="";$("login").disabled=false;}};
$("save").onclick=async()=>{if(!auth.currentUser)return;const note=$("note").value.trim();if(!note||note.length>100){status("Digite uma observação de até 100 caracteres.");return;}$("save").disabled=true;status("Enviando...");try{await setDoc(ref(),{dono:auth.currentUser.uid,palete:"TESTE-SYNC-001",observacao:note,origem:"laboratorio",atualizadoEm:serverTimestamp()});status("Gravação confirmada.");}catch(e){status("Falha ao gravar: "+e.code+" — "+e.message)}finally{$("save").disabled=false;}};
$("logout").onclick=async()=>{if(stop){stop();stop=null;}await signOut(auth);$("save").disabled=true;$("logout").disabled=true;$("live").textContent="Sessão encerrada.";status("Sessão encerrada.")};
</script></body></html>
