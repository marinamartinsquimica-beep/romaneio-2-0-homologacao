<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Romaneio 2.0 — Teste Firebase</title><style>body{font:16px system-ui;background:#f3f8fb;color:#254D69;padding:20px}main{max-width:620px;margin:auto}section{background:white;border:1px solid #c9dce7;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 4px;font-weight:bold}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px}input{border:1px solid #9db9ca}button{border:0;background:#254D69;color:white;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526a7a}</style></head><body><main><h2>Romaneio 2.0 — Laboratório Firebase</h2><p>Teste isolado de conectividade e login. Não grava no Firestore e não altera o Romaneio oficial.</p><section><button id="rede">1. Testar rede Firebase</button><pre id="resultado-rede">Aguardando.</pre></section><section><label>E-mail cadastrado no Firebase</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="senha" type="password" autocomplete="current-password"><button id="entrar">2. Testar autenticação</button><button id="sair" disabled>Encerrar sessão</button><pre id="resultado-login">Aguardando.</pre><small>Não compartilhe sua senha. A página não armazena credenciais. Não há consultas ou gravações no banco.</small></section></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyAtlG-oys0IgqgCdiANbzuzx9Mh9siMRQo",authDomain:"romaneio-2-0-laboratorio.firebaseapp.com",projectId:"romaneio-2-0-laboratorio",appId:"1:343680211941:web:8ad689db2c09447c2ded0c"};
const $=id=>document.getElementById(id);let auth;
try{auth=getAuth(initializeApp(cfg));await auth.setPersistence((await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js")).inMemoryPersistence);}catch(e){$("resultado-login").textContent="Falha ao carregar SDK: "+e.message;}
$("rede").onclick=async()=>{const start=performance.now();$("resultado-rede").textContent="Testando...";try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/projects?key="+encodeURIComponent(cfg.apiKey),{cache:"no-store"});$("resultado-rede").textContent="Servidor respondeu: SIM\nHTTP: "+r.status+"\nTempo: "+Math.round(performance.now()-start)+" ms\nMesmo erros HTTP indicam resposta do servidor.";}catch(e){$("resultado-rede").textContent="Falha de rede: "+e.message;}};
$("entrar").onclick=async()=>{if(!auth){$("resultado-login").textContent="SDK indisponível";return;}$("entrar").disabled=true;$("resultado-login").textContent="Autenticando...";try{const r=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("senha").value);$("resultado-login").textContent="Autenticação concluída. Usuário autenticado: SIM."; $("sair").disabled=false;}catch(e){$("resultado-login").textContent="Falha: "+e.code+" — "+e.message;}finally{$("senha").value="";$("entrar").disabled=false;}};
$("sair").onclick=async()=>{await signOut(auth);$("sair").disabled=true;$("resultado-login").textContent="Sessão encerrada."};
</script></body></html>
