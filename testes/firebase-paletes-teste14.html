<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste 14 — Dois paletes</title><style>body{font:16px system-ui;background:#f2f8fa;color:#254D69;max-width:720px;margin:auto;padding:16px}section{background:white;border:1px solid #cbdde5;border-radius:12px;padding:15px;margin:12px 0}button,input,select{font:inherit;padding:10px;margin:4px;border:1px solid #abc3cc;border-radius:7px}button{background:#5CDCF2;font-weight:700}button:disabled{opacity:.5}#aviso{border:2px solid #FFA385;padding:12px;background:#fff3eb}#aviso[hidden]{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Teste 14 — Mesmo SKU e lote em dois paletes</h1><p>Laboratório Firebase, sem alterações na produção ou SharePoint.</p><section><h2>1. Login</h2><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button id="entrar">Entrar</button><p id="login">Desconectado</p></section><section><h2>2. Paletes compartilhados</h2><button id="criar" disabled>Inicializar se ausente</button><pre id="resumo"></pre></section><section><h2>3. Inclusão</h2><select id="palete"><option>LAB-A</option><option>LAB-B</option></select><input id="qtd" type="number" min="1" value="13"><button id="add" disabled>Adicionar caixas</button><button id="retry" disabled>Reenviar última operação técnica</button><div id="aviso" hidden><strong>Possível ação duplicada</strong><p>Mesma quantidade do mesmo SKU e lote no mesmo palete. Confirma a nova inclusão?</p><button id="sim">Sim — Adicionar</button><button id="nao">Não — Cancelar</button></div></section><section><h2>Histórico</h2><select id="histPalete"><option>LAB-A</option><option>LAB-B</option></select><pre id="hist"></pre><h2>Mensagens</h2><pre id="log"></pre></section><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,doc,onSnapshot,runTransaction}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAtlG-oys01gqgCdiANbzuzx9Mh9SiMRQo",authDomain:"romaneio-2-0-laboratorio.firebaseapp.com",projectId:"romaneio-2-0-laboratorio",storageBucket:"romaneio-2-0-laboratorio.firebasestorage.app",messagingSenderId:"343680211941",appId:"1:343680211941:web:8ad689db2c09447c2ded0c"}),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),ids=["LAB-A","LAB-B"],refs=Object.fromEntries(ids.map(id=>[id,doc(db,"rom_lab_paletes14",id)]));let user=null,offs=[],busy=false,docs={},pending=null,last=null;function msg(s){$("log").textContent=s+"\n"+$("log").textContent}function enable(){for(const id of ["criar","add"])$(id).disabled=!user||busy||!!pending;$("retry").disabled=!user||busy||!!pending||!last;$("sim").disabled=busy;$("nao").disabled=busy}function render(){$("resumo").textContent=ids.map(id=>id+" | SKU G | Lote 001 | Estoque "+(docs[id]?.estoque??"—")+" | Romaneio "+(docs[id]?.romaneio??"—")+" | Operações "+(docs[id]?.operacoes?.length??"—")).join("\n");$("hist").textContent=docs[$("histPalete").value]?.historico?.join("\n")||"Sem dados"}$("histPalete").onchange=render;
onAuthStateChanged(auth,u=>{offs.forEach(f=>f());offs=[];user=u;docs={};$("login").textContent=u?"Conectado: "+u.email:"Desconectado";enable();render();if(u)for(const id of ids)offs.push(onSnapshot(refs[id],s=>{docs[id]=s.exists()?s.data():null;render()},e=>msg("ERRO LEITURA "+id+": "+e.code+" "+e.message)))});$("entrar").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("senha").value);$("senha").value=""}catch(e){msg("ERRO LOGIN "+e.message)}};async function act(fn){busy=true;enable();try{msg(await fn())}catch(e){msg("ERRO "+(e.code||"")+": "+e.message)}finally{busy=false;enable()}}
$("criar").onclick=()=>act(async()=>{let n=0;for(const id of ids){if(await runTransaction(db,async t=>{const s=await t.get(refs[id]);if(s.exists())return false;t.set(refs[id],{codigo:id,sku:"G",lote:"001",estoque:50,romaneio:0,operacoes:[],historico:["Inicializado: 0 caixas"]});return true}))n++}return n+" paletes criados. Existentes preservados."});
function ultima(d){for(let i=(d?.historico?.length||0)-1;i>=0;i--){const m=/^\+(\d+) caixas \| operação /.exec(d.historico[i]);if(m)return Number(m[1])}return null}
async function enviar(op,confirmed){return runTransaction(db,async t=>{const s=await t.get(refs[op.p]);if(!s.exists())throw Error("Inicialize primeiro");const d=s.data();if(d.operacoes.includes(op.id))return"REPETIÇÃO TÉCNICA IGNORADA";if(d.operacoes.length>=25)throw Error("Limite do laboratório");if(d.romaneio+op.q>100000)throw Error("Limite numérico");if(ultima(d)===op.q&&!confirmed)throw Error("Outra inclusão igual ocorreu. Confira antes de repetir.");t.update(refs[op.p],{romaneio:d.romaneio+op.q,operacoes:[...d.operacoes,op.id],historico:[...d.historico,"+"+op.q+" caixas | operação "+op.id]});return"CONFIRMADO +"+op.q+" no "+op.p})}
function novo(p,q){last={id:crypto.randomUUID(),p,q};return last}function fechar(){pending=null;$("aviso").hidden=true;enable()}
$("add").onclick=()=>{const p=$("palete").value,q=Number($("qtd").value);if(!Number.isSafeInteger(q)||q<1||q>100000){msg("Quantidade inválida");return}if(!docs[p]){msg("Inicialize primeiro");return}if(ultima(docs[p])===q){pending={p,q};$("aviso").hidden=false;enable();msg("Aguardando confirmação. Nenhuma caixa adicionada.");return}return act(()=>enviar(novo(p,q),false))};$("sim").onclick=()=>{const v=pending;fechar();return act(()=>enviar(novo(v.p,v.q),true))};$("nao").onclick=()=>{fechar();msg("Inclusão cancelada")};$("retry").onclick=()=>act(()=>enviar(last,true));render();enable();
</script>
