<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romaneio — Teste 9</title><style>body{font:16px system-ui;background:#f2f8fa;color:#254D69;max-width:760px;margin:auto;padding:16px}section{background:white;border:1px solid #cbdde5;border-radius:12px;padding:15px;margin:12px 0}button,input,select{padding:10px;margin:4px;border:1px solid #a6bdc7;border-radius:7px;font:inherit}button{background:#5CDCF2;font-weight:bold}pre{white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style><h1>Teste 9 — Isolamento de paletes</h1><p>Simulação local. Sem Firebase, SharePoint ou dados reais.</p><section><button id="reset">Reiniciar dados fictícios</button><table><thead><tr><th>Palete / SKU / Lote / Destino</th><th>Estoque</th><th>Romaneio</th><th>Pendência</th></tr></thead><tbody id="dados"></tbody></table></section><section><h2>Adicionar caixas sem bloqueio</h2><select id="palete"><option>LAB-A</option><option>LAB-B</option><option>LAB-C</option></select><input id="qtd" type="number" value="30" min="1"><button id="adicionar">Adicionar</button></section><section><h2>Corrigir pelo estoque</h2><select id="alvo"><option>LAB-A</option><option>LAB-B</option><option>LAB-C</option></select><select id="tipo"><option value="rom">Romaneio</option><option value="est">Estoque fictício</option></select><input id="valor" type="number" value="20" min="0"><button id="corrigir">Corrigir</button></section><section><h2>Testes automáticos</h2><button id="testar">Executar testes</button><pre id="result"></pre><h2>Histórico</h2><pre id="hist"></pre></section><script>
const base=()=>({A:{sku:"G",lote:"001",dest:"Norte",est:20,rom:0,h:[]},B:{sku:"M",lote:"002",dest:"Sul",est:50,rom:0,h:[]},C:{sku:"G",lote:"003",dest:"Norte",est:15,rom:0,h:[]}}),key="rom_teste9_local";let s;try{s=JSON.parse(localStorage.getItem(key))||base()}catch{s=base()}const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(s));render()}function render(){$("dados").replaceChildren();for(const [k,v] of Object.entries(s)){const tr=document.createElement("tr");[k+" / "+v.sku+" / "+v.lote+" / "+v.dest,v.est,v.rom,Math.max(0,v.rom-v.est)].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.append(td)});$("dados").append(tr)}$("hist").textContent=Object.entries(s).map(([k,v])=>k+": "+(v.h.join(" | ")||"Sem alterações")).join("\n")}function valid(v){return Number.isSafeInteger(v)&&v>=0&&v<=100000}function add(st,k,n){if(!valid(n)||n<1||!valid(st[k].rom+n))throw Error("Quantidade inválida");st[k].rom+=n;st[k].h.push("Adicionadas "+n+" caixas")}function fix(st,k,t,n){if(!valid(n))throw Error("Quantidade inválida");st[k][t]=n;st[k].h.push("Corrigido "+t+" para "+n)}$("reset").onclick=()=>{if(confirm("Reiniciar apenas dados fictícios deste teste?")){s=base();save()}};$("adicionar").onclick=()=>{try{add(s,$("palete").value.slice(-1),Number($("qtd").value));save()}catch(e){alert(e.message)}};$("corrigir").onclick=()=>{try{fix(s,$("alvo").value.slice(-1),$("tipo").value,Number($("valor").value));save()}catch(e){alert(e.message)}};$("testar").onclick=()=>{let n=0;const out=[];function test(label,f){try{if(!f())throw Error("Resultado inesperado");out.push("APROVADO — "+label);n++}catch(e){out.push("FALHOU — "+label+": "+e.message)}}let t=base();add(t,"A",30);test("Aceita 30 caixas com estoque de 20",()=>t.A.rom===30);test("Pendência exclusiva do LAB-A",()=>t.A.rom-t.A.est===10&&t.B.rom===0&&t.C.rom===0);add(t,"B",12);test("LAB-B independente",()=>t.B.rom===12&&t.A.rom===30);fix(t,"A","est",30);test("Correção do estoque resolve apenas LAB-A",()=>t.A.est===30&&t.B.est===50);fix(t,"C","rom",9);test("Lotes do mesmo SKU independentes",()=>t.C.rom===9&&t.A.rom===30);test("Históricos isolados",()=>t.A.h.length===2&&t.B.h.length===1&&t.C.h.length===1);$("result").textContent=out.join("\n")+"\n"+n+"/6 aprovados"};render();
</script>
