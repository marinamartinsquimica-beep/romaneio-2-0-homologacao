name: Validacao isolada 2.0.50
on:
  push:
    branches: [desenvolvimento/v2.0.50]
    paths:
      - 'integracao/**'
      - 'index.html'
      - '.github/workflows/testes-romaneio-250.yml'
  workflow_dispatch:
jobs:
  testes-locais:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar protocolo e comparacao
        working-directory: integracao
        run: |
          node conferencia-compartilhada.test.mjs
          node protocolo-movimentos.test.mjs
          node publicador-firestore.test.mjs
          node sincronizador-fila.test.mjs
      - name: Validar sintaxe do codigo da fila
        run: |
          node --check integracao/protocolo-movimentos.js
          node --check integracao/publicador-firestore.js
          node --check integracao/sincronizador-fila.js
          node --check integracao/envio-movimentos250.js
      - name: Validar sintaxe do painel principal
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      props = dict(attrs)
                      self.capture = not props.get('src') and props.get('type', '') in ('', 'text/javascript', 'module')
                      if self.capture:
                          self.parts.append('')
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.parts[-1] += data
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert parser.parts, 'Nenhum script interno encontrado'
          for i, code in enumerate(parser.parts):
              Path(f'/tmp/romaneio-script-{i}.mjs').write_text(code, encoding='utf-8')
          print(f'{len(parser.parts)} scripts internos extraídos')
          PY
          for arquivo in /tmp/romaneio-script-*.mjs; do node --check "$arquivo"; done
